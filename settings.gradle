pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'terramath'

// Every target is versions/<minecraft>/<loader>; its settings live in versions/<minecraft>/version.properties.
def requested = (settings.providers.gradleProperty('targets').getOrElse('') ?: '')
    .split(',').collect { it.trim() }.findAll { it }

file('versions').eachDir { mcDir ->
    mcDir.eachDir { loaderDir ->
        if (!new File(loaderDir, 'build.gradle').exists()) {
            return
        }
        def versionProps = new Properties()
        new File(mcDir, 'version.properties').withInputStream { versionProps.load(it) }
        if (versionProps.getProperty('build') == 'modern') {
            return
        }
        String name = "${mcDir.name}-${loaderDir.name}"
        if (requested.isEmpty() || requested.contains(name)) {
            include(name)
            project(":${name}").projectDir = loaderDir
        }
    }
}

includeBuild('modern')
