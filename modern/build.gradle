plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
    id 'net.minecraftforge.gradle' version '[7.0.17,8)' apply false
    id 'com.gradleup.shadow' version '9.0.0' apply false
}

tasks.register('dist') {
    group = 'build'
    description = 'Builds the unobfuscated targets and copies the release jars into dist/'
    dependsOn subprojects.collect { "${it.path}:collectJar" }
}
