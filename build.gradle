plugins {
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.0.0" apply false
}

apply from: 'gradle/telegram.gradle'
apply from: 'gradle/deploy.gradle'

// Collects every target's release jar into dist/.
tasks.register('dist') {
    group = 'build'
    description = 'Builds all targets and copies the release jars into dist/'
    dependsOn subprojects.collect { "${it.path}:collectJar" }
}

tasks.named('dist') { mustRunAfter 'cleanDist' }
